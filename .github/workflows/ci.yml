name: CI

# Runs only for release tags (vX.Y.Z), not on every commit or pull request.
# Use workflow_dispatch to run it manually.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  extension-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run ui:build
      - uses: actions/upload-artifact@v4
        with:
          name: companion-web-ui
          path: server/web-dist
          if-no-files-found: error

  rust:
    needs: extension-ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: companion-web-ui
          path: server/web-dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo check --manifest-path server/Cargo.toml
